# tag 推送打全平台; workflow_dispatch 可只打 macos / linux / windows / extension, 挂到已有 Release.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Which package to build
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - extension
        default: all
      tag:
        description: GitHub Release tag to attach assets to (e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  PLATFORM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform || 'all' }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!tag) throw new Error("RELEASE_TAG empty");
            const body = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Dash Download ${tag}`,
              generate_release_notes: true,
            };
            let release;
            try {
              release = (await github.rest.repos.createRelease(body)).data;
            } catch (err) {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = existing.data;
            }
            core.setOutput("release_id", String(release.id));

  # job-level if 不能引用 matrix.*, 先筛平台再展开.
  matrix-prep:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      run_app: ${{ steps.set.outputs.run_app }}
    steps:
      - id: set
        uses: actions/github-script@v7
        env:
          PLATFORM: ${{ env.PLATFORM }}
        with:
          script: |
            const all = [
              { host: "macos-latest", rust_target: "aarch64-apple-darwin", args: "--target aarch64-apple-darwin --bundles app,dmg", platform: "macos" },
              { host: "ubuntu-22.04", rust_target: "x86_64-unknown-linux-gnu", args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage", platform: "linux" },
              { host: "windows-latest", rust_target: "x86_64-pc-windows-msvc", args: "--target x86_64-pc-windows-msvc --bundles nsis", platform: "windows" },
            ];
            const p = process.env.PLATFORM || "all";
            const sel = p === "all" ? all : all.filter((x) => x.platform === p);
            core.setOutput("run_app", sel.length ? "true" : "false");
            core.setOutput("matrix", JSON.stringify({ include: sel.length ? sel : all }));

  app:
    needs: [prepare, matrix-prep]
    if: ${{ needs.matrix-prep.outputs.run_app == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux webkit deps
        if: matrix.host == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dash Download ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}


  # matrix 各自上传 latest.json 会互盖且可能漏传; 全部平台结束后按 .sig 重写一份.
  updater-manifest:
    needs: [prepare, app]
    if: ${{ !cancelled() && needs.app.result != 'skipped' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PLATFORM: ${{ env.PLATFORM }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number("${{ needs.prepare.outputs.release_id }}");
            const tag = process.env.RELEASE_TAG;
            const full = process.env.PLATFORM === "all";
            const release = (await github.rest.repos.getRelease({
              owner, repo, release_id: releaseId,
            })).data;
            const assets = release.assets;
            const find = (re) => assets.find((a) => re.test(a.name));
            const readSig = async (asset) => {
              const res = await github.request(`GET /repos/${owner}/${repo}/releases/assets/${asset.id}`, {
                headers: { Accept: "application/octet-stream" },
              });
              if (typeof res.data === "string") return res.data.trim();
              return Buffer.from(res.data).toString("utf8").trim();
            };
            const pair = async (key, fileRe, sigRe) => {
              const file = find(fileRe);
              const sig = find(sigRe);
              if (!file || !sig) return null;
              return [key, { url: file.browser_download_url, signature: await readSig(sig) }];
            };
            // Tauri 2 签的是 NSIS setup.exe, 不再出 nsis.zip.
            const entries = (await Promise.all([
              pair("darwin-aarch64", /\.app\.tar\.gz$/, /\.app\.tar\.gz\.sig$/),
              pair("linux-x86_64", /\.AppImage$/, /\.AppImage\.sig$/),
              pair("windows-x86_64", /x64-setup\.exe$/, /x64-setup\.exe\.sig$/),
            ])).filter(Boolean);
            const old = assets.find((a) => a.name === "latest.json");
            let existing = {};
            if (old) {
              const res = await github.request(`GET /repos/${owner}/${repo}/releases/assets/${old.id}`, {
                headers: { Accept: "application/octet-stream" },
              });
              const raw = typeof res.data === "string" ? res.data : Buffer.from(res.data).toString("utf8");
              try {
                existing = JSON.parse(raw).platforms || {};
              } catch (err) {
                core.warning("old latest.json parse: " + err.message);
              }
            }
            const platforms = { ...existing, ...Object.fromEntries(entries) };
            const missing = ["darwin-aarch64", "linux-x86_64", "windows-x86_64"]
              .filter((k) => !platforms[k]);
            if (full && missing.length) {
              throw new Error("latest.json 缺平台: " + missing.join(","));
            }
            if (missing.length) {
              core.warning("latest.json 仍缺: " + missing.join(","));
            }
            const version = tag.replace(/^v/, "");
            const body = {
              version,
              notes: tag,
              pub_date: new Date().toISOString(),
              platforms,
            };
            if (old) {
              await github.rest.repos.deleteReleaseAsset({
                owner, repo, asset_id: old.id,
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: "latest.json",
              data: JSON.stringify(body, null, 2),
              headers: { "content-type": "application/json" },
            });
            core.info("uploaded latest.json platforms=" + Object.keys(body.platforms).join(","));

  # tauri-action 默认文件名带空格/点, 改成 DashDownload-{ver}-{os}-{arch} 后再让 prune 跑.
  normalize-assets:
    needs: [prepare, updater-manifest, extension]
    if: ${{ !cancelled() && (needs.updater-manifest.result == 'success' || needs.updater-manifest.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize release asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/normalize_release_assets.py "${{ env.RELEASE_TAG }}"

  extension:
    needs: prepare
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'extension' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pack Chrome extension zip
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          tag="${RELEASE_TAG}"
          mkdir -p dist-ext/dash-download-chrome
          cp -R extension/. dist-ext/dash-download-chrome/
          (cd dist-ext && zip -r "../dash-download-chrome-${tag}.zip" dash-download-chrome)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dash-download-chrome-${{ env.RELEASE_TAG }}.zip

  prune:
    needs: [app, extension, updater-manifest, normalize-assets]
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100,
            });
            const published = releases.filter((item) => !item.draft);
            for (const stale of published.slice(3)) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: stale.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${stale.tag_name}`,
                });
              } catch (err) {
                core.warning(`delete tag ${stale.tag_name}: ${err.message}`);
              }
            }
