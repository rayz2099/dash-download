# 自动更新链路 (1.2.1+ 客户端读 GitHub /releases/latest, 不再要 latest.json):
# 1. prepare 先建 draft, 避免打到一半抢 /releases/latest, 旧版会看到没 .sig 的半成品
# 2. 各平台 tauri-action 把安装包 + .sig 挂到同一 Release
# 3. normalize 用 release_id 改资产名 (draft 的 /releases/tags/{tag} 是 404)
# 4. 有至少一对安装包+.sig 才把 draft 转正
#
# tag 推送打全平台; workflow_dispatch 可只打 macos / linux / windows / extension, 挂到已有 tag.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Which package to build
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
          - extension
        default: all
      tag:
        description: GitHub Release tag to attach assets to (e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  PLATFORM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform || 'all' }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!tag) throw new Error("RELEASE_TAG empty");
            const body = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Dash Download ${tag}`,
              generate_release_notes: true,
              draft: true,
            };
            let release;
            try {
              release = (await github.rest.repos.createRelease(body)).data;
            } catch (err) {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = existing.data;
            }
            core.setOutput("release_id", String(release.id));

  # job-level if 不能引用 matrix.*, 先筛平台再展开.
  matrix-prep:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      run_app: ${{ steps.set.outputs.run_app }}
    steps:
      - id: set
        uses: actions/github-script@v7
        env:
          PLATFORM: ${{ env.PLATFORM }}
        with:
          script: |
            const all = [
              { host: "macos-latest", rust_target: "aarch64-apple-darwin", args: "--target aarch64-apple-darwin --bundles app,dmg", platform: "macos" },
              { host: "ubuntu-22.04", rust_target: "x86_64-unknown-linux-gnu", args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage", platform: "linux" },
              { host: "windows-latest", rust_target: "x86_64-pc-windows-msvc", args: "--target x86_64-pc-windows-msvc --bundles nsis", platform: "windows" },
            ];
            const p = process.env.PLATFORM || "all";
            const sel = p === "all" ? all : all.filter((x) => x.platform === p);
            core.setOutput("run_app", sel.length ? "true" : "false");
            core.setOutput("matrix", JSON.stringify({ include: sel.length ? sel : all }));

  app:
    needs: [prepare, matrix-prep]
    if: ${{ needs.matrix-prep.outputs.run_app == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux webkit deps
        if: matrix.host == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ui install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Dash Download ${{ env.RELEASE_TAG }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # linker-signed Mach-O 不是 bundle 签. 带 quarantine 时 Gatekeeper 报已损坏, 右键也救不回来.
      # signingIdentity "-" 必须在打 tar.gz / dmg 之前生效, 所以这里只验, 不补签.
      - name: Verify macOS ad-hoc bundle signature
        if: matrix.host == 'macos-latest'
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Dash Download.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          meta=$(codesign -dv --verbose=2 "$app" 2>&1)
          echo "$meta"
          echo "$meta" | grep -q 'Identifier=dev.ray.dash-download'
          if echo "$meta" | grep -q linker-signed; then
            echo "still linker-signed; signingIdentity - did not apply" >&2
            exit 1
          fi


  # tauri-action 默认文件名带空格/点, 改成 DashDownload-{ver}-{os}-{arch} 后再转正.
  # 必须传 release_id: draft 的 /releases/tags/{tag} 是 404 (v1.2.1 就是这样挂的).
  normalize-assets:
    needs: [prepare, app, extension]
    if: ${{ !cancelled() && (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize release asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/normalize_release_assets.py "${{ env.RELEASE_TAG }}" "${{ needs.prepare.outputs.release_id }}"

  extension:
    needs: prepare
    if: ${{ github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'extension' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pack Chrome extension zip
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          tag="${RELEASE_TAG}"
          mkdir -p dist-ext/dash-download-chrome
          cp -R extension/. dist-ext/dash-download-chrome/
          (cd dist-ext && zip -r "../dash-download-chrome-${tag}.zip" dash-download-chrome)

      - name: Upload extension zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "${RELEASE_TAG}" "dash-download-chrome-${RELEASE_TAG}.zip" --clobber

  # 有安装包+.sig 才转正, /releases/latest 才切到本 tag. normalize 失败也不挡,
  # 因为 1.2.1 客户端按后缀匹配, Tauri 默认文件名也能升.
  publish:
    needs: [prepare, app, normalize-assets]
    if: ${{ !cancelled() && (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number("${{ needs.prepare.outputs.release_id }}");
            const release = (await github.rest.repos.getRelease({
              owner, repo, release_id: releaseId,
            })).data;
            const names = new Set(release.assets.map((a) => a.name));
            const hasPair = [...names].some((n) => {
              if (!names.has(n + ".sig")) return false;
              return n.endsWith(".app.tar.gz")
                || n.endsWith(".AppImage")
                || n.endsWith("x64-setup.exe")
                || n.endsWith("win-x64.exe");
            });
            if (!hasPair) {
              core.warning("no installer+.sig pair, leave draft unpublished");
              return;
            }
            if (!release.draft) {
              core.info("already published");
              return;
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: releaseId, draft: false,
            });
            core.info("published " + release.tag_name);

  prune:
    needs: [app, extension, normalize-assets, publish]
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100,
            });
            const published = releases.filter((item) => !item.draft);
            for (const stale of published.slice(3)) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: stale.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${stale.tag_name}`,
                });
              } catch (err) {
                core.warning(`delete tag ${stale.tag_name}: ${err.message}`);
              }
            }
