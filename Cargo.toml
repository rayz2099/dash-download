[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
exclude = ["vendor/librqbit"]

[workspace.package]
version = "1.2.4"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
futures-util = "0.3"
rand = "0.8"

[profile.release]
lto = "thin"
strip = true

# handshake 循环读 + TCP_NODELAY. 上游 9.0.1 单次 read 会把拆包握手打成 0 live.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
